---
layout: default
---
<main>
	<article itemscope itemtype="https://schema.org/BlogPosting">
		<h1 itemprop="headline">{{ page.title }}</h1>
		<time class="meta" itemprop="datePublished" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date_to_string }}</time>

		<div class="post" itemprop="articleBody">
		{{ content }}
		</div>

		{% include disclaimer-modal.html %}
		{% include discus.html %}
	</article>
</main>

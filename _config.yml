name: Brain Beats Pro Blog | Brainwave Entrainment
description: Brain Beats Pro - Free online brainwave entrainment generator for binaural beats, isochronic tones, solfeggio frequencies, and ambient noise.
markdown: kramdown
kramdown:
  math_engine: mathjax
  parse_block_html: true
  input: GFM
  syntax_highlighter_opts:
    disable : true

permalink: /blog/:year/:month/:day/:title.html
url: "https://brain-beats-pro.netlify.app"
baseurl: ""
repository: Mr-Kumar-Abhishek/brain-beats-blog

paginate_path: "/blog/blog/page:num/"
paginate: 50
future: true
compress_html:
  ignore:
    envs: [development, production]
plugins:
  - jekyll-paginate
  - jekyll-feed
  - jekyll-sitemap # Ruby backup when Node.js is unavailable; DevOps flows overwrite _site/sitemap.xml with scripts/generate-sitemap.js

include: [".well-known", "_redirects"]

exclude: ["node_modules", "package-lock.json", "css/main.scss", "blog/css/main.scss", "scratch", "Gemfile", "Gemfile.lock", "tests", "reports", "lab", "wiki", "sitemap-old.xml", "fileList.js", "generate_posts.py", "_config.fast.yml", "workbox-config.js", ".github", ".agents", "DEVELOPMENT.md", "TEST_REPORT.md", "RELEASE_NOTES.md", "CONTRIBUTING.md", "cocomo-cost-estimate.md", "README.md", "LICENSE.txt", "LICENSE-CONTENT.txt"]

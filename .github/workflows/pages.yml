name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
      - main
      - doctor/master
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-deploy"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.node-version'
          cache: 'npm'

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true

      - name: Setup Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Run Audio Engine Test Suite (TDD)
        run: npm test

      - name: Run Ruby & Node Builds Simultaneously
        env:
          JEKYLL_ENV: production
        run: |
          echo "Starting Ruby Jekyll site build and Node asset/SW build simultaneously..."
          
          # Start Ruby Jekyll build in the background
          bundle exec jekyll build &
          JEKYLL_PID=$!
          
          # Start Node build (CSS transpilation, Sitemap generation, Service Worker precache) in the background
          # Low-priority: service worker precache does not block or fail the primary Ruby site build
          (npm run build || echo "::warning::Non-critical: npm/service worker build finished with warnings.") &
          NODE_PID=$!
          
          # Wait for primary Jekyll build and simultaneous Node asset build
          wait $JEKYLL_PID
          wait $NODE_PID || true
          echo "Simultaneous Ruby and Node builds completed."

      - name: Sync Sitemap, Service Worker & Bypass Jekyll Processing
        run: |
          cp sitemap.xml _site/sitemap.xml || true
          cp sw-generated.js _site/sw-generated.js || true
          cp css/main.css _site/css/main.css || true
          cp blog/css/main.css _site/blog/css/main.css || true
          cp README.md _site/README.md || true
          cp RELEASE_NOTES.md _site/RELEASE_NOTES.md || true
          cp DEVELOPMENT.md _site/DEVELOPMENT.md || true
          cp TEST_REPORT.md _site/TEST_REPORT.md || true
          cp CONTRIBUTING.md _site/CONTRIBUTING.md || true
          cp cocomo-cost-estimate.md _site/cocomo-cost-estimate.md || true
          cp package.json _site/package.json || true
          cp .node-version _site/.node-version || true
          cp .nvmrc _site/.nvmrc || true
          cp netlify.toml _site/netlify.toml || true
          touch _site/.nojekyll

      - name: Deploy to gh-pages Branch
        uses: peaceiris/actions-gh-pages@v4
        if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/doctor/master'
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./_site
          keep_files: false
          commit_message: "deploy(pages): update production web application build for ${{ github.sha }}\n\nPublish Jekyll production bundle, audio engine, and static PWA assets to gh-pages branch.\n- Source commit: ${{ github.sha }}\n- Automated deployment via GitHub Actions"

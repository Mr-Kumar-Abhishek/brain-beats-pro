<div id="google_translate_element" class="google-translate-box my-2 my-xl-0 me-xl-2"></div>
<script type="text/javascript">
(function() {
  var rtlLanguages = {
    'ar': true, 'arc': true, 'bcc': true, 'bqi': true, 'ckb': true,
    'dv': true, 'fa': true, 'glk': true, 'he': true, 'iw': true,
    'khw': true, 'ks': true, 'ku': true, 'mzn': true, 'pnb': true,
    'ps': true, 'sd': true, 'ug': true, 'ur': true, 'yi': true
  };

  function getActiveLanguage() {
    var combo = document.querySelector('.goog-te-combo');
    if (combo && combo.value) {
      return combo.value;
    }
    var match = document.cookie.match(/(?:^|;\s*)googtrans=\/([^/]+)\/([^;]+)/);
    if (match && match[2]) {
      return match[2];
    }
    return '';
  }

  function applyLanguageUX(lang) {
    if (!lang) {
      lang = getActiveLanguage();
    }
    var baseLang = (lang || '').toLowerCase().split('-')[0];
    var isRtl = !!rtlLanguages[baseLang];
    var html = document.documentElement;

    if (isRtl) {
      html.setAttribute('dir', 'rtl');
      html.classList.add('rtl-mode');
    } else {
      html.setAttribute('dir', 'ltr');
      html.classList.remove('rtl-mode');
    }

    if (lang) {
      html.setAttribute('lang', lang);
      html.setAttribute('data-translated-lang', lang);
    }

    try {
      var event = new CustomEvent('bb:languagechange', { detail: { language: lang, isRtl: isRtl } });
      document.dispatchEvent(event);
    } catch (e) {}
  }

  function attachComboListener() {
    var combo = document.querySelector('.goog-te-combo');
    if (combo && !combo.dataset.listenerBound) {
      combo.dataset.listenerBound = 'true';
      combo.setAttribute('aria-label', 'Translate website language');
      combo.addEventListener('change', function(e) {
        applyLanguageUX(e.target.value);
      });
      if (combo.value) {
        applyLanguageUX(combo.value);
      }
    }
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', function() {
      applyLanguageUX();
    });
  } else {
    applyLanguageUX();
  }

  if (typeof MutationObserver !== 'undefined') {
    var observer = new MutationObserver(function() {
      attachComboListener();
    });
    observer.observe(document.documentElement, { childList: true, subtree: true });
  }

  window.addEventListener('load', function() {
    attachComboListener();
    setTimeout(attachComboListener, 1000);
    setTimeout(attachComboListener, 2500);
  });
})();

function googleTranslateElementInit() {
  if (typeof google !== 'undefined' && google.translate && google.translate.TranslateElement) {
    new google.translate.TranslateElement({
      pageLanguage: 'en',
      autoDisplay: false
    }, 'google_translate_element');
  }
}
</script>
<script type="text/javascript" async src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
